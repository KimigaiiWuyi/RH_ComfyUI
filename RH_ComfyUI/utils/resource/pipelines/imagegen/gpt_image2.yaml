name: gpt-image-2
display_name: GPT-Image2
task_type: image   # 主任务,但 capabilities.supported_tasks 同时支持下面三种
backend: gpt-image-2
point_cost: 2
description: |
  OpenAI 兼容协议的 GPT-Image2 生图模型。
  一个物理模型同时支持文生图、图生图、图片编辑,根据 request.images 自适应切换。
  凭证可指向任何兼容 OpenAI 协议的网关(OneAPI / NewAPI / OpenRouter / Local Ollama 等),
  也能直接使用 OpenAI 官方接口。
knowledge_content: |
  GPT-Image2 是 OpenAI 兼容协议的生图模型,具备完整的多模态生成能力。
  优势：
  - 单端点覆盖文生图 / 图生图 / 图片编辑三种模式,无需切换模型或复制配置
  - 自适应输入:有图片时自动进入图生图 / 编辑模式,无图片时进入文生图模式
  - 兼容任何暴露 /v1/images/generations 的 OpenAI 兼容服务(官方 / 第三方聚合 / 本地)
  适用场景：
  - 需要统一生图能力、简化配置的对话机器人与 Web 应用
  - 希望根据用户上传图片动态切换生成模式
  - 复杂的图片编辑 / 画风转变等功能
  不适用场景：
  - 无
requirements:
  - gpt_image2_apikey
mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.gpt_image2:gpt_image2_mapper"

capabilities:
  priority: 65
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: 生成描述
  images:
    type: list
    item_type: image
    required: false
    description: 参考图片(可选)。上传即自动进入图生图/编辑模式,留空即为文生图
  width:
    type: integer
    default: 1024
    description: 图片宽度(用于推断比例)
  height:
    type: integer
    default: 1024
    description: 图片高度(用于推断比例)

outputs:
  image:
    type: output_image
    description: 生成的图片