name: qwen_2511
display_name: Qwen-Edit 2511
task_type: image
backend: comfyui
point_cost: 4
description: 专业的图像编辑模型,支持中文指令和多图输入
knowledge_content: |
  专业的图像编辑模型(Qwen-Image-Edit 2511)。
  优势:中文指令理解准确,支持精确的区域编辑,可同时处理多图输入。
  适用场景:局部修图和编辑,多图融合处理,照片精修,添加或删除元素。
  不适用场景:从零生图(建议用 qwen_2512),本节点需要至少 1 张参考图。
requirements:
  - comfyui_url
workflow: qwen_edit_2511.json
mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.image_edit:qwen_edit_mapper"

capabilities:
  priority: 70
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: 编辑指令
  images:
    type: list
    item_type: image
    required: true
    min_items: 1
    max_items: 3
    description: 待编辑图片(1~3 张)

outputs:
  image:
    type: output_image
    description: 编辑后的图片
