name: banana2
display_name: Nano Banana 2
task_type: image
backend: gpt-image-2
backend_model: gemini-3.1-flash-image-preview
point_cost: 2
description: Gemini 3.1 Flash 图像生成/编辑模型,速度快,适合快速生成和预览
knowledge_content: |
  Nano Banana 2 图像生成/编辑模型(Gemini 3.1 Flash)。
  优势:生成速度非常快,支持快速迭代测试,质量稳定可控,适合批量生成;
  同时支持图片编辑(传入 1~N 张参考图时自动进入编辑模式)。
  适用场景:需要较快速度但保持较好质量的图像,精细画面,快速图片编辑。
  不适用场景:需要极高细节的专业商业图(建议用 banana_pro)。
requirements:
  - gpt_image2_apikey
mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.gpt_image2:gpt_image2_mapper"

capabilities:
  priority: 70
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: 生成描述或编辑指令
  images:
    type: list
    item_type: image
    required: false
    min_items: 0
    max_items: 3
    description: |
      参考图片(0~3 张):
        - 0 张=文生图
        - 1+ 张=图片编辑
  width:
    type: integer
    default: 720
    description: 图片宽度(仅文生图模式用于推断比例)
  height:
    type: integer
    default: 1280
    description: 图片高度(仅文生图模式用于推断比例)

outputs:
  image:
    type: output_image
    description: 生成的图片
