name: anima
display_name: Anima
task_type: image
backend: rh_app
point_cost: 2
description: 专精于二次元风格图像生成的 RunningHub AI 应用，擅长动漫角色、插画、场景等
knowledge_content: |
  Anima 是一款专精于二次元风格图像生成的 AI 应用。
  优势：二次元动漫风格表现力强，角色立绘质量高，色彩鲜明，细节丰富。
  适用场景：动漫角色生成、二次元插画、萌系头像、动漫场景、同人创作。
  不适用场景：写实照片、3D 渲染、非二次元风格图像。
  提示词建议：使用中文或日文描述角色特征、服装、表情、背景、画风等。
requirements:
  - rh_apikey
workflow: "2059263409362923521"
mode: declarative

capabilities:
  priority: 50
  mode: async_poll

inputs:
  prompt:
    type: text
    required: true
    description: 生成描述
  width:
    type: integer
    default: 720
    description: 图片宽度
  height:
    type: integer
    default: 1280
    description: 图片高度

outputs:
  image:
    type: output_image
    description: 生成的二次元图片

mappings:
  - source: prompt
    target: "12.prompt"
    description: "prompt"
  - source: width
    target: "7.width"
    default: "720"
    description: "width"
  - source: height
    target: "7.height"
    default: "1280"
    description: "height"
