name: qwen_2512
display_name: Qwen-Image 2512
task_type: image
backend: comfyui
point_cost: 2
description: 千问Image2512模型，擅长中文提示词理解，适合各种风格的图像生成
knowledge_content: |
  千问Image2512模型，擅长中文提示词理解，适合各种风格的图像生成。
  优势：中文提示词理解能力强，支持复杂风格描述，输出质量稳定可靠，成本低。
  适用场景：中文场景的图像生成，简单需求，二次元动漫头像，通用图像生成。
  不适用场景：需要极高细节的专业商业图、超写实人像。
requirements:
  - comfyui_url
workflow: qwen_2512.json
mode: declarative

capabilities:
  priority: 80
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: 生成描述
  width:
    type: integer
    default: 720
    description: 图片宽度
    minimum: 256
    maximum: 2048
  height:
    type: integer
    default: 1280
    description: 图片高度
    minimum: 256
    maximum: 2048
  negative_prompt:
    type: text
    required: false
    description: 反向提示词

outputs:
  image:
    type: output_image
    description: 生成的图片

mappings:
  - source: prompt
    target: "108.inputs.text"
  - source: width
    target: "107.inputs.width"
    default: 720
  - source: height
    target: "107.inputs.height"
    default: 1280
