name: mimo_tts
display_name: MiMoTTS 语音合成
task_type: speech
backend: mimo
point_cost: 3
description: XiaoMi MiMo-V2.5-TTS 系列语音合成，支持预置音色、音色设计、音色复刻，风格控制丰富
knowledge_content: |
  XiaoMi MiMo-V2.5-TTS 是小米推出的高质量语音合成系列模型。
  支持三种模式：
  1. mimo-v2.5-tts：预置精品音色，开箱即用，支持唱歌模式
  2. mimo-v2.5-tts-voicedesign：通过文本描述定制音色，无需预置或音频样本
  3. mimo-v2.5-tts-voiceclone：基于音频样本复刻任意音色
  风格控制能力：
  - 多风格切换：同一段语音内完成播报→低语→嘶吼的风格转场
  - 多情绪混合：支持复合情绪如"压抑的愤怒"、"带着哽咽的笑意"
  - 自然语言控制：通过描述性语句控制语气、语速、情绪
  - 音频标签控制：支持 [吸气] [叹气] [笑] [哭泣] 等细粒度标签
  - 导演模式：从角色、场景、指导三个维度全方位刻画人物与声线
  支持的情绪/风格：开心/悲伤/愤怒/恐惧/惊讶/兴奋/委屈/平静/冷漠/温柔/高冷/
  活泼/严肃/慵懒/俏皮/深沉/干练/凌厉/磁性/醇厚/清亮/空灵/稚嫩/苍老/甜美/沙哑 等
  支持方言：东北话/四川话/河南话/粤语
  适用场景：配音、有声内容制作、角色扮演、唱歌、语音播报。
requirements:
  - mimo_apikey
mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.mimo_speech:mimo_tts_mapper"

capabilities:
  priority: 65
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: 待合成文本
  mood:
    type: string
    required: false
    description: 情绪/风格控制指令(如 "用慵懒的语调")
  voice_id:
    type: string
    required: false
    description: 预置音色 ID(可选,留空使用默认)
  reference_audio:
    type: audio
    required: false
    description: 参考音频(用于音色复刻)
  params:
    type: string
    required: false
    description: 预留扩展(可指定 model 等)

outputs:
  audio:
    type: output_audio
    description: 生成的语音
