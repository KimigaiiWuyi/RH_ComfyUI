name: wan2.2_videogen
display_name: Wan2.2 视频生成
task_type: video
backend: comfyui
point_cost: 15
description: |
  Wan 2.2 统一视频生成节点,按输入自动切换:
    - 不传图    → 文生视频
    - 传 1 张图  → 图生视频(首帧)
    - 传 2 张图  → 首尾帧生视频(图片1=首帧,图片2=尾帧,其余作参考)
  可在 prompt 中用 "图片1" / "图片2" 等代号引用参考图(支持位置插值)。
knowledge_content: |
  Wan 2.2 统一视频生成模型。
  优势:中文支持良好,可以生成分辨率较高的视频,动作流畅。
  适用场景:创意视频生成,动画制作,短视频创作,基于图片的短视频。
  注意:多张参考图(>=2)仅在 router 选中 Seedance 多模态节点时才会
  真正生效;ComfyUI Wan 工作流仅消费首帧图。
requirements:
  - comfyui_url

# 默认 workflow(0 张图时使用)→ wan2.2_t2v.json
# 带图场景由 mapper.video.wan_videogen_mapper 调用
# `api.set_workflow_override("wan2.2_i2v.json")` 动态覆盖。
workflow: wan2.2_t2v.json
mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.video:wan_videogen_mapper"

capabilities:
  priority: 70
  mode: sync

inputs:
  prompt:
    type: text
    required: true
    description: |
      视频描述。多图场景可用 "图片1"/"图片2"/... 等代号引用下方
      传入的素材,系统会自动替换为首帧/尾帧/参考图等位置标签。
  images:
    type: list
    item_type: image
    required: false
    min_items: 0
    max_items: 9
    description: |
      参考图片(0~9 张):
        - 0 张=文生视频
        - 1 张=图生视频(该图作为首帧)
        - 2 张=首尾帧(图片1=首帧,图片2=尾帧)
        - 更多=仅取首帧(Wan 端),其余交给多模态节点
  width:
    type: integer
    default: 720
    description: 视频宽度
  height:
    type: integer
    default: 1280
    description: 视频高度
  duration:
    type: integer
    default: 5
    description: 视频时长(秒)

outputs:
  video:
    type: output_video
    description: 生成的视频
