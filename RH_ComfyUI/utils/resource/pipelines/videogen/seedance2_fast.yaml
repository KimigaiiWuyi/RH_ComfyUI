name: seedance2_fast
display_name: Seedance 2.0 Fast
task_type: video
backend: seedance
backend_model: doubao-seedance-2-0-fast-260128
point_cost: 15
description: Seedance 2.0 Fast 视频生成,速度更快、价格更低(不支持 1080p)
knowledge_content: |
  Seedance 2.0 Fast 是 Seedance 2.0 的快速版本,价格更低、生成更快。
  仅支持 480p 与 720p 分辨率(不支持 1080p)。
  输入形态由系统自动决定:
    - 不传图 → 文生视频
    - 1 张图 → 图生视频(首帧)
    - 2+张图 → 首尾帧 / 多模态参考
  适用场景:快速预览、低成本批量生成。
requirements:
  - seedance_apikey

mode: programmatic
mapper: "RH_ComfyUI.utils.mappers.seedance:seedance_video_mapper"

capabilities:
  priority: 85
  mode: async_poll

inputs:
  prompt:
    type: text
    required: true
    description: 视频生成提示词
  ratio:
    type: enum
    values: ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9", "adaptive"]
    default: "16:9"
    description: 视频宽高比
  resolution:
    type: enum
    values: ["480p", "720p"]
    default: "720p"
    description: 视频分辨率(Fast 版不支持 1080p)
  duration:
    type: integer
    default: 5
    minimum: 4
    maximum: 15
    description: 视频时长(秒)
  seed:
    type: integer
    required: false
    description: 随机种子
  generate_audio:
    type: boolean
    default: false
    description: 是否生成同步音频
  watermark:
    type: boolean
    default: false
    description: 是否添加 AI 水印
  camera_fixed:
    type: boolean
    default: false
    description: 摄像机是否固定
  return_last_frame:
    type: boolean
    default: false
    description: 是否同时返回尾帧图

outputs:
  video:
    type: output_video
    description: 生成的视频(MP4)
  last_frame:
    type: output_image
    description: 视频尾帧图
