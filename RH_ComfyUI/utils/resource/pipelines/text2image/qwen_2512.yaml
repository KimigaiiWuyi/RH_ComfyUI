description: "千问Image2512模型，擅长中文提示词理解，适合各种风格的图像生成"
knowledge_content: |
  千问Image2512模型，擅长中文提示词理解，适合各种风格的图像生成。
  优势：中文提示词理解能力强，支持复杂风格描述，输出质量稳定可靠，成本低。
  适用场景：中文场景的图像生成，简单需求，二次元动漫头像，通用图像生成。
  不适用场景：需要极高细节的专业商业图、超写实人像。
requirements:
  - comfyui_url
workflow: "qwen_2512.json"
mode: declarative
mappings:
  - source: prompt
    target: "108.inputs.text"
  - source: width
    target: "107.inputs.width"
    default: 720
  - source: height
    target: "107.inputs.height"
    default: 1280
