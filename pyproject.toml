[project]
name = "RH_ComfyUI"
version = "2.0.0"
description = "AIGC统一生成插件，支持ComfyUI/BLT等多后端，声明式Pipeline架构，智能模型路由"
authors = [
    {name = "KimigaiiWuyi", email = "444835641@qq.com"},
]
dependencies = [
    "httpx>=0.25.0",
    "pillow>=10.1.0",
    "aiofiles>=23.2.1",
    "aiohttp>=3.8.6",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "google-genai>=1.68.0",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
